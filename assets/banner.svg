<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glowing filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#textGrad);
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .pulse-line {
      stroke: #6366f1;
      stroke-width: 1.5;
      stroke-dasharray: 6, 6;
      opacity: 0.4;
      animation: dash 30s linear infinite;
    }
    .data-particle {
      fill: #38bdf8;
      animation: float 4s ease-in-out infinite alternate;
    }
    .node-circle {
      fill: url(#nodeGrad);
      filter: url(#lightGlow);
      animation: pulseNode 3s ease-in-out infinite alternate;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes pulseNode {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="316" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

  <!-- Dynamic Network / Memory Graph Background Layer (Kept in Background with opacity) -->
  <g opacity="0.25">
    <!-- Graph Edges -->
    <line x1="100" y1="80" x2="250" y2="160" class="pulse-line" />
    <line x1="250" y1="160" x2="180" y2="260" class="pulse-line" />
    <line x1="250" y1="160" x2="400" y2="100" class="pulse-line" />
    <line x1="400" y1="100" x2="550" y2="220" class="pulse-line" />
    <line x1="1050" y1="70" x2="920" y2="150" class="pulse-line" />
    <line x1="920" y1="150" x2="1020" y2="250" class="pulse-line" />
    <line x1="920" y1="150" x2="780" y2="80" class="pulse-line" />

    <!-- Graph Nodes -->
    <circle cx="100" cy="80" r="6" fill="#818cf8" />
    <circle cx="250" cy="160" r="10" class="node-circle" />
    <circle cx="180" cy="260" r="7" fill="#38bdf8" />
    <circle cx="400" cy="100" r="8" fill="#c084fc" />
    <circle cx="550" cy="220" r="6" fill="#818cf8" />
    <circle cx="1050" cy="70" r="7" fill="#38bdf8" />
    <circle cx="920" cy="150" r="12" class="node-circle" />
    <circle cx="1020" cy="250" r="8" fill="#c084fc" />
    <circle cx="780" cy="80" r="6" fill="#818cf8" />
  </g>

  <!-- Ambient Glowing Orbs -->
  <circle cx="600" cy="160" r="180" fill="#4f46e5" opacity="0.12" filter="url(#glow)" />
  <circle cx="200" cy="100" r="100" fill="#0284c7" opacity="0.08" filter="url(#glow)" />

  <!-- FOREGROUND CONTENT (Guaranteed clear & legible) -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Tag / Pill Badge -->
    <rect x="-140" y="-85" width="280" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
    <text x="0" y="-65" text-anchor="middle" class="badge-text">🧠 AI AGENT MEMORY PLATFORMS</text>

    <!-- Main Title -->
    <text x="0" y="-5" text-anchor="middle" class="title" filter="url(#lightGlow)">Awesome AI Agent Memory Platform</text>
    
    <!-- Subtitle -->
    <text x="0" y="38" text-anchor="middle" class="subtitle">Curated Ecosystem of Long-Term Memory, Knowledge Graphs &amp; Context Store</text>

    <!-- Sub-badges info -->
    <g transform="translate(0, 80)">
      <rect x="-240" y="-14" width="480" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" opacity="0.8"/>
      <text x="0" y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">
        ⚡ Vector DBs • 🕸️ Temporal Knowledge Graphs • 💾 OS-Style Tiered Context
      </text>
    </g>
  </g>
</svg>
